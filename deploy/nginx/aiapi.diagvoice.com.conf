# aiapi.diagvoice.com → backend (docker compose, 127.0.0.1:8085)
#
# Kurulum (GPU sunucusunda, host nginx):
#   sudo cp deploy/nginx/aiapi.diagvoice.com.conf /etc/nginx/sites-available/aiapi.diagvoice.com
#   sudo ln -s /etc/nginx/sites-available/aiapi.diagvoice.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d aiapi.diagvoice.com      # TLS: 443 bloğunu ve 80→443 yönlendirmesini ekler
#
# DNS: aiapi.diagvoice.com A kaydı bu sunucunun Elastic IP'sini göstermeli. Güvenlik grubu: 80, 443 açık; 8085 kapalı.

upstream diagvoice_backend {
    server 127.0.0.1:8085;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name aiapi.diagvoice.com;

    # Ses yüklemeleri
    client_max_body_size 200m;
    client_body_timeout 300s;

    # Uzun analizler (STT + tüm modeller) dakikalar sürebilir.
    proxy_connect_timeout 10s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    send_timeout 900s;

    location / {
        proxy_pass http://diagvoice_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # Backend istemci IP'sini X-Forwarded-For'un ilk değerinden okur (cms/usage_audit.py).
        # İstemcinin gönderdiği değeri ezmek için $remote_addr kullanılıyor (sahte IP engeli).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # İleride SSE (iş ilerlemesi) için tamponlamayı kapat; yüklemeyi nginx tamponlasın.
        proxy_buffering off;
    }

    # Güvenlik başlıkları
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;
}
