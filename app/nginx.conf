# SPA sunucusu (konteyner içi). Domain/TLS Coolify proxy'sinde.
# Not: nginx'te location içindeki add_header, server seviyesindekileri iptal eder;
# bu yüzden güvenlik başlıkları her location'da tekrarlanıyor.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hash'li build dosyaları: uzun önbellek
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # React Router: /admin/... gibi yolları index.html'e düşür
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri $uri/ /index.html;
    }
}
