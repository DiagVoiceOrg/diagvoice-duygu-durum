; WORKER_MODE=worker (varsayılan): 3 süreç — fusion + worker-gpu + worker-cpu.
; Modeller registry.yaml'dan; eski 10 süreçli düzen için WORKER_MODE=legacy (supervisord.conf).
[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:worker-gpu]
directory=/app
priority=10
environment=WORKER_GROUP="gpu",WORKER_PORT="8060"
command=python -m dv_worker.app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-cpu]
directory=/app
priority=10
environment=WORKER_GROUP="cpu",WORKER_PORT="8061"
command=python -m dv_worker.app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fusion-service]
directory=/app
priority=40
environment=FUSION_PORT="8085",TEXT_TO_SENTIMENT_URL="http://127.0.0.1:8060/text_sentiment/analyze",VOICE_TO_TEXT_URL="http://127.0.0.1:8060/stt/transcribe",VOICE_TO_SENTIMENT_URL="http://127.0.0.1:8060/emotion_audio/analyze-audio",DISEASE_SERVICE_URL="http://127.0.0.1:8060/disease_wurss/analyze-disease",AGE_GENDER_URL="http://127.0.0.1:8060/age_gender/analyze-age-gender",DEPRESSION_SERVICE_URL="http://127.0.0.1:8060/depression/analyze-depression",TURKISH_PSYCH_CLASSIFIER_URL="http://127.0.0.1:8060/turkish_psych/analyze",EMOTION_V2_URL="http://127.0.0.1:8060/emotion_v2/analyze-audio",MENTAL_FITNESS_URL="http://127.0.0.1:8061/mental_fitness/analyze-mental",INFERENCE_API_URL="http://127.0.0.1:8061/occupational_health"
command=python /app/fusion_service/app.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
