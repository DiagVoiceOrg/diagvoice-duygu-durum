[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:text-to-sentiment]
directory=/app
priority=10
environment=TEXT_TO_SENTIMENT_PORT="8050"
command=python /app/text_to_sentiment/app.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:voice-to-text]
directory=/app
priority=10
environment=VOICE_TO_TEXT_PORT="8051"
command=python /app/voice_to_text/app.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:voice-to-sentiment]
directory=/app
priority=10
environment=AUDIO_SENTIMENT_CKPT="/app/models/wavlm_v6_multicrop_ema_best.pt",VOICE_TO_SENTIMENT_PORT="8052"
command=python /app/voice_to_sentiment/app.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:inference-api]
directory=/app
priority=15
environment=DIAGVOICE_BENCHMARK_CONFIG="/app/inference_api/config.docker.yaml",DIAGVOICE_MODEL="/app/models/is-sagligi.joblib",DIAGVOICE_STRICT_FEATURES="1"
command=/bin/sh -c 'exec python -m flask --app inference_api.app run --host=127.0.0.1 --port=8053'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fusion-service]
directory=/app
priority=40
environment=FUSION_PORT="8085",INFERENCE_API_URL="http://127.0.0.1:8053"
command=python /app/fusion_service/app.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:disease-service]
directory=/app
priority=20
environment=DISEASE_SERVICE_PORT="8054"
command=python /app/disease_service/app.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mental-fitness]
directory=/app
priority=20
environment=MENTAL_FITNESS_MODEL_PATH="/app/models/extratreesclassifier.joblib",MENTAL_FITNESS_PORT="8055"
command=python /app/mental_fitness/app.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:age-gender]
directory=/app/age-gender-model
priority=20
environment=AGE_GENDER_MODEL_DIR="/app/models",AGE_GENDER_PORT="8056"
command=python app.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:depression-service]
directory=/app
priority=20
environment=DEPRESSION_MODEL_PATH="/app/models/depresyon.pt",DEPRESSION_BACKBONE="facebook/wav2vec2-base",DEPRESSION_BACKBONE_CACHE_DIR="/app/.cache/huggingface",DEPRESSION_SERVICE_PORT="8057"
