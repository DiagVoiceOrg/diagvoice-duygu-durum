# DiagVoice backend — GPU sunucusu (PROD_PLAN F3). FE ayrı: Coolify (CPU sunucusu) app/ klasörünü build eder.
#
#   İnternet ─443─▶ host nginx (TLS) ─▶ 127.0.0.1:8085 ─▶ gateway ─┬─▶ worker-gpu:8060 (8 model, tek CUDA süreci)
#                                                                  ├─▶ worker-cpu:8061 (sklearn modelleri)
#                                                                  └─▶ redis:6379     (iş kuyruğu, limitler)
#
# - Dışarıya yalnızca gateway açık ve sadece 127.0.0.1:8085'te; worker'lar ve redis iç ağda.
# - Modeller ve yolları: diagvoice-backend/registry.yaml. Worker durumu: GET /ready (gateway üzerinden de: /ready).
# - Üç servis aynı image'ı farklı komutla çalıştırır. Kod ./diagvoice-backend → /app (bind mount).
# - Ortam: kök .env. Değişince: docker compose up -d --force-recreate
# - Dağıtım: scripts/deploy.sh   ·   Geri dönüş (tek konteyner): docker compose -f docker-compose.single.yml up -d
# - GPU: NVIDIA sürücüsü + nvidia-container-toolkit. GPU'suz sunucu: -f docker-compose.yml -f docker-compose.cpu.yml
#   (scripts/deploy.sh GPU yoksa bunu kendisi seçer).

x-backend: &backend
  build:
    context: ./diagvoice-backend
    dockerfile: Dockerfile
  image: diagvoice-backend:latest
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - ./diagvoice-backend:/app
    - backend_hf_cache:/app/.cache
    - ./data/audio_recordings:/data/audio_recordings
    - ./data/jobs:/data/jobs
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker-gpu:
    <<: *backend
    command: ["python", "-m", "dv_worker.app"]
    environment:
      WORKER_GROUP: gpu
      WORKER_PORT: "8060"
      WORKER_HOST: 0.0.0.0
      HF_HUB_DISABLE_XET: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8060/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 900s   # modeller yüklenene kadar (ilk açılışta HF indirmeleri) /health cevap vermez

  worker-cpu:
    <<: *backend
    command: ["python", "-m", "dv_worker.app"]
    environment:
      WORKER_GROUP: cpu
      WORKER_PORT: "8061"
      WORKER_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8061/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 900s   # modeller yüklenene kadar (ilk açılışta HF indirmeleri) /health cevap vermez

  gateway:
    <<: *backend
    command: ["python", "/app/fusion_service/app.py"]
    ports:
      - "127.0.0.1:8085:8085"   # sadece makine içi; dış dünya host nginx üzerinden gelir
    depends_on:
      redis: { condition: service_healthy }
      worker-gpu: { condition: service_healthy }
      worker-cpu: { condition: service_healthy }
    environment:
      FUSION_PORT: "8085"
      # production: JWT_SECRET / CMS_ADMIN_PASSWORD / API_KEY_PEPPER zayıfsa uygulama başlamaz
      DIAGVOICE_ENV: ${DIAGVOICE_ENV:-production}
      CMS_ENABLED: ${CMS_ENABLED:-1}
      MONGO_URI: ${MONGO_URI:?MONGO_URI tanımlı olmalı — kök .env içinde harici Mongo bağlantı dizesi}
      MONGO_DB: ${MONGO_DB:-diagvoice_cms}
      AUDIT_AUDIO_STORAGE_DIR: /data/audio_recordings
      REDIS_URL: redis://redis:6379/0
      JOBS_DIR: /data/jobs
      WORKER_GPU_URL: http://worker-gpu:8060
      WORKER_CPU_URL: http://worker-cpu:8061
      TEXT_TO_SENTIMENT_URL: http://worker-gpu:8060/text_sentiment/analyze
      VOICE_TO_TEXT_URL: http://worker-gpu:8060/stt/transcribe
      VOICE_TO_SENTIMENT_URL: http://worker-gpu:8060/emotion_audio/analyze-audio
      DISEASE_SERVICE_URL: http://worker-gpu:8060/disease_wurss/analyze-disease
      AGE_GENDER_URL: http://worker-gpu:8060/age_gender/analyze-age-gender
      DEPRESSION_SERVICE_URL: http://worker-gpu:8060/depression/analyze-depression
      TURKISH_PSYCH_CLASSIFIER_URL: http://worker-gpu:8060/turkish_psych/analyze
      EMOTION_V2_URL: http://worker-gpu:8060/emotion_v2/analyze-audio
      MENTAL_FITNESS_URL: http://worker-cpu:8061/mental_fitness/analyze-mental
      INFERENCE_API_URL: http://worker-cpu:8061/occupational_health
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  backend_hf_cache:
  redis_data:
